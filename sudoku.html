<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Sudoku Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sudoku Solver</h1>
            <button id="theme-toggle" class="btn-secondary">🌓 Mode</button>
        </div>
        
        <div id="sudoku-board"></div> 

        <div class="visualizer-panel">
            <div class="slider-group">
                <label for="speed-slider">Speed: <span id="speed-val">100ms</span></label>
                <input type="range" id="speed-slider" min="1" max="500" value="100">
            </div>
            <div class="status-text" id="status-display">Idle</div>
        </div>
        
        <div class="controls">
            <button id="solve-btn" class="btn-primary">Visualize Solve</button>
            <button id="pause-btn" class="btn-secondary" disabled>Pause</button>
            <button id="clear-btn" class="btn-secondary">Clear Board</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
